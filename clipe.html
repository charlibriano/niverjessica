    var cf = grow(t, LINES[78].s, 3); for(var k=0;k<26;k++){ var v = ((t*.18 + k*.137) % 1); if(cf <= 0) break; ctx.fillStyle = [ROSE, LEAF, '#d9960f', '#3b6fd1'][k%4]; ctx.save(); ctx.translate(R.x + (k*.381 % 1)*R.w, R.y + v*R.h); ctx.rotate(t*2 + k); ctx.globalAlpha *= cf*.8; ctx.fillRect(-3, -1.5, 6, 3); ctx.restore(); }
  }
  // p25: de novo, e de novo, e de novo — o jardim floresce
  function illAgain(t, R){
    var cx = R.x + R.w/2, cy = R.y + R.h*.45, u = Math.min(R.w, R.h);
    var times3 = [wordT(85, 'novo'), wordT(86, 'novo'), wordT(87, 'novo')];
    times3.forEach(function(tt, i){ var k = grow(t, tt - .4, .9); if(k <= 0) return; var x = cx + (i - 1)*u*.32; heartPath(x, cy, u*.13*easeBack(k)*(1 + A.bass*.1)); ctx.fillStyle = i === 1 ? GREEN_INK : ROSE; ctx.fill(); sparkles(x, cy, u*.2, 6, k); });
    var gp = grow(t, LINES[82].s, 14), gb = grow(t, times3[2] + .5, 4);
    for(var f=0; f<14; f++){ var k2 = clamp(gp*14 - f, 0, 1) || 0; if(k2 <= 0) continue; var fx = R.x + R.w*(.04 + .92*((f*.37) % 1)), fy = R.y + R.h*(.72 + ((f*.53) % 1)*.2);
      ctx.strokeStyle = LEAF; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx, R.y + R.h); ctx.lineTo(fx, fy); ctx.stroke(); flower(FKINDS[f % 6], fx, fy, (u*.09 + gb*u*.07)*easeBack(k2), Math.sin(t + f)*.2); }
    var fam = grow(t, LINES[83].s, 1);
    if(fam > 0){ ctx.save(); ctx.globalAlpha *= fam; var fb = R.y + R.h*.99, fh5 = R.h*.3, sway = Math.sin(t*1.6)*fh5*.03;
      him(cx - fh5*.32 + sway, fb, fh5, {hold:[cx - fh5*.12 + sway, fb - fh5*.32], phase:0});
      child(cx + sway, fb, fh5*.5, t, 0, 1, false);
      her(cx + fh5*.32 + sway, fb, fh5*.95, {holdL:[cx + fh5*.12 + sway, fb - fh5*.32], phase:1}); ctx.restore(); }
  }
  function cornerFlowers(pg, t){
    var s = Math.min(W, H)*.11, k = easeBack(grow(t, LINES[pg.from].s - .9, 1.2)), kind = FKINDS[(pg.num + 2) % 6], kind2 = FKINDS[(pg.num + 4) % 6];
    ctx.strokeStyle = LEAF; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(W, H*.98); ctx.quadraticCurveTo(W - s*1.2, H - s*.4, W - s*1.5*k, H - s*1.4*k); ctx.stroke();
    flower(kind, W - s*.55, H - s*.75, s*.9*k, .3); flower(kind2, W - s*1.35, H - s*.35, s*.6*k, -.2);
    ctx.fillStyle = LEAF; ctx.beginPath(); ctx.ellipse(W - s*1.05*k, H - s*1.05*k, s*.2*k, s*.08*k, -.7, 0, 6.3); ctx.fill();
  }

  var PAGES = [
    {num:1, from:0, to:5, ill:illBrasilia}, {num:2, from:5, to:9, ill:illTime}, {num:3, from:9, to:15, ill:illWedding},
    {num:4, from:15, to:18, ill:illSign}, {num:5, from:18, to:21, ill:illPaths}, {num:6, from:21, to:23, ill:illQuill},
    {num:7, from:23, to:25, ill:illStorm}, {num:8, from:25, to:27, ill:illThousand}, {num:9, from:27, to:29, ill:illLighthouse},
    {num:10, from:29, to:31, ill:illGlobe}, {num:11, from:31, to:36, ill:illDreams}, {num:12, from:36, to:42, ill:illFamily},
    {num:13, from:42, to:48, ill:illKintsugi}, {num:14, from:48, to:50, ill:illBook}, {num:15, from:50, to:52, ill:illBoat},
    {num:16, from:52, to:54, ill:illFlowers}, {num:17, from:54, to:56, ill:illAnchor}, {num:18, from:56, to:58, ill:illHill},
    {num:19, from:58, to:60, ill:illName}, {num:20, from:60, to:62, ill:illCrowd}, {num:21, from:62, to:68, ill:illDict},
    {num:22, from:68, to:72, ill:illWalk}, {num:23, from:72, to:78, ill:illOld}, {num:24, from:78, to:82, ill:illCake},
    {num:25, from:82, to:88, ill:illAgain}
  ];
  var TURN_LEAD = .7, TURN_DUR = 1.7; // a página começa a virar 0,7 s antes da frase nova e leva 1,7 s
  function drawBook(t, alpha){
    if(alpha <= 0) return;
    ctx.save(); ctx.globalAlpha = alpha;
    var k = 0, turning = -1, p = 0;
    for(var i=0;i<PAGES.length;i++){
      var s0 = LINES[PAGES[i].from].s;
      if(i > 0 && t >= s0 - TURN_LEAD && t < s0 - TURN_LEAD + TURN_DUR){ turning = i; p = (t - (s0 - TURN_LEAD))/TURN_DUR; }
      if(i === 0 || t >= s0 - TURN_LEAD + TURN_DUR) k = i;
    }
    if(turning > 0) turnPage(PAGES[turning-1], PAGES[turning], t, ease(p)); else drawPage(PAGES[k], t);
    ctx.restore();
  }

  /* ===== Roteiro: capa abre, páginas, e o livro fecha no fim ===== */
  function env(t, a, b, fin, fout){ return clamp((t - a)/fin, 0, 1)*clamp((b - t)/fout, 0, 1); }
  var T_CLOSE = LINES[N-1].e + 5;
  function render(t, dt){
    T_NOW = t;
    night(t, dt, false);
    drawCover(t, env(t, -1, 12.6, .01, .8), ease((t - 9.4)/1.9), ease((t - 10.6)/1.6), 0);
    drawBook(t, env(t, 11.8, T_CLOSE + .9, .8, .9));
    if(t > T_CLOSE) drawCover(t, clamp((t - T_CLOSE)/.7, 0, 1), 1 - ease((t - T_CLOSE - 1.3)/1.8), 1 - ease((t - T_CLOSE)/1.6), T_CLOSE + 3.3);
    document.body.classList.toggle('paper', t > 12.4 && t < T_CLOSE + .4);
  }

  function resize(){ W = cv.clientWidth; H = cv.clientHeight; cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); PAGES.forEach(function(p){ p.geo = null; }); }
  window.addEventListener('resize', resize); resize();

  /* ===== Interface ===== */
  var player = document.getElementById('player'), cover = document.getElementById('cover'), startBtn = document.getElementById('startBtn'), startLabel = document.getElementById('startLabel');
  var elSec = document.getElementById('section'), live = document.getElementById('liveLine');
  var fill = document.getElementById('fill'), track = document.getElementById('track'), elCur = document.getElementById('cur'), elDur = document.getElementById('dur');
  var playBtn = document.getElementById('play'), icoPlay = document.getElementById('icoPlay'), icoPause = document.getElementById('icoPause');
  function setPlaying(on){
    document.body.classList.toggle('playing', on);
    if(on){ icoPlay.setAttribute('hidden',''); icoPause.removeAttribute('hidden'); playBtn.setAttribute('aria-label','Pausar'); }
    else { icoPause.setAttribute('hidden',''); icoPlay.removeAttribute('hidden'); playBtn.setAttribute('aria-label','Tocar'); }
    wake();
  }
  audio.addEventListener('loadedmetadata', function(){ elDur.textContent = fmt(audio.duration); });
  audio.addEventListener('play', function(){ setPlaying(true); });
  audio.addEventListener('pause', function(){ setPlaying(false); });
  audio.addEventListener('ended', function(){ setTimeout(function(){ startLabel.textContent = 'Ouvir de novo'; cover.classList.add('end'); cover.hidden = false; document.body.classList.add('covered'); requestAnimationFrame(function(){ cover.classList.remove('gone'); }); }, 1500); });
  function play(){ ensureAudioGraph(); if(audio.ended) audio.currentTime = 0; var p = audio.play(); if(p && p.catch) p.catch(function(e){ showError('Não deu para tocar: ' + e.message); }); }
  function toggle(){ if(audio.paused) play(); else audio.pause(); }
  playBtn.addEventListener('click', toggle);
  startBtn.addEventListener('click', function(){ cover.classList.add('gone'); document.body.classList.remove('covered'); setTimeout(function(){ cover.hidden = true; cover.classList.remove('end'); }, 900); audio.currentTime = 0; play(); });
  var idleTimer = 0;
  function wake(){ document.body.classList.remove('idle'); clearTimeout(idleTimer); if(!audio.paused) idleTimer = setTimeout(function(){ document.body.classList.add('idle'); }, 2800); }
  ['pointermove','pointerdown','keydown'].forEach(function(ev){ document.addEventListener(ev, wake); });
  function seekFromX(x){ var rc = track.getBoundingClientRect(); var pct = clamp((x - rc.left)/rc.width, 0, 1); if(audio.duration) audio.currentTime = pct*audio.duration; }
  var dragging = false;
  track.addEventListener('pointerdown', function(e){ dragging = true; track.setPointerCapture(e.pointerId); seekFromX(e.clientX); });
  track.addEventListener('pointermove', function(e){ if(dragging) seekFromX(e.clientX); });
  track.addEventListener('pointerup', function(){ dragging = false; });
  track.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 5); e.preventDefault(); }
    if(e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
  });
  document.addEventListener('keydown', function(e){ if(e.code === 'Space' && cover.hidden && e.target.tagName !== 'BUTTON'){ e.preventDefault(); toggle(); } });

  var lastNow = performance.now(), lastIdx = -2;
  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(.05, (now - lastNow)/1000); lastNow = now;
    var t = audio.currentTime, d = audio.duration || 0;
    readAudio(dt, now/1000);
    var idx = currentIndex(t);
    if(idx !== lastIdx){ lastIdx = idx; elSec.textContent = idx >= 0 ? LINES[idx].sec : ''; live.textContent = idx >= 0 ? LINES[idx].text : ''; }
    try{ render(t, dt); }catch(e){ showError('Erro ao desenhar: ' + e.message); throw e; }
    var pct = d ? t/d : 0; fill.style.width = (pct*100) + '%'; track.setAttribute('aria-valuenow', Math.round(pct*100));
    elCur.textContent = fmt(t); elDur.textContent = fmt(d);
  }
  if(location.hash === '#render'){ // modo de gravação do MP4
    window.__renderStep = function(t, f, dt){ window.__F = f; readAudio(dt, t); render(t, dt); };
    window.__ready = (document.fonts ? document.fonts.ready : Promise.resolve()).then(function(){ PAGES.forEach(function(p){ p.geo = null; }); return true; });
    return;
  }
  player.hidden = false; cover.hidden = false; document.body.classList.add('covered');
  var fontsP = document.fonts ? Promise.all(['500 40px "Dancing Script"','600 40px "Cormorant Garamond"','italic 500 40px "Cormorant Garamond"','40px "Great Vibes"'].map(function(f){ return document.fonts.load(f).catch(function(){}); })) : Promise.resolve();
  Promise.race([fontsP, new Promise(function(r){ setTimeout(r, 4000); })]).then(function(){ PAGES.forEach(function(p){ p.geo = null; }); startBtn.disabled = false; startLabel.textContent = 'Ouvir a música'; });
  requestAnimationFrame(frame);
})();
